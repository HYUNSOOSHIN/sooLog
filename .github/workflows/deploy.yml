# master에 push되면 Gatsby 빌드 후 hyunsooshin.github.io 저장소(main)에 배포
name: Deploy

on:
    push:
        branches: [master]
    workflow_dispatch:

concurrency:
    group: deploy
    cancel-in-progress: true

jobs:
    deploy:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 22
                  cache: yarn

            - run: yarn install --frozen-lockfile

            - run: yarn build

            - uses: peaceiris/actions-gh-pages@v4
              with:
                  deploy_key: ${{ secrets.ACTIONS_DEPLOY_KEY }}
                  external_repository: HYUNSOOSHIN/hyunsooshin.github.io
                  publish_branch: main
                  publish_dir: ./public
                  cname: www.hyunsooshin.com
                  user_name: github-actions[bot]
                  user_email: github-actions[bot]@users.noreply.github.com
                  full_commit_message: "deploy: ${{ github.event.head_commit.message || github.sha }}"
